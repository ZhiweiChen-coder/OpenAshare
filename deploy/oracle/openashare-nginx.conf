limit_req_zone $binary_remote_addr zone=openashare_api:10m rate=30r/m;

server {
    listen 80;
    server_name api.openashare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.openashare.com;

    # Create these certificates with Certbot before enabling this config.
    ssl_certificate /etc/letsencrypt/live/api.openashare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.openashare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=openashare_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
